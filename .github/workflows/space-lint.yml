name: space-lint

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to lint'
        required: true
        default: 'space-port/phase-2'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Install lua5.3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.3

      - name: Lua syntax-check all space content + registration files
        shell: bash
        run: |
          cd MMOCoreORB/bin/scripts
          FAIL=0; CHECKED=0
          while IFS= read -r -d '' f; do
            luac5.3 -p "$f" 2>/tmp/e || { echo "SYNTAX FAIL: $f"; cat /tmp/e; FAIL=1; }
            CHECKED=$((CHECKED+1))
          done < <(find ai_space managers/space ship_mobile mobile/space mobile/conversations/space \
                        screenplays/space object/ship object/intangible/ship object/tangible/ship \
                        object/tangible/space object/static/space object/draft_schematic/space \
                        loot/groups/ship loot/groups/space loot/items/ship loot/items/space \
                        -name '*.lua' -print0 2>/dev/null)
          for r in loot/items.lua loot/groups.lua object/serverobjects.lua screenplays/screenplays.lua; do
            [ -f "$r" ] && { luac5.3 -p "$r" 2>/tmp/e || { echo "SYNTAX FAIL (reg): $r"; cat /tmp/e; FAIL=1; }; CHECKED=$((CHECKED+1)); }
          done
          echo "lua-parsed $CHECKED files"
          [ $FAIL -eq 0 ] && echo "LUA SYNTAX: PASS" || { echo "LUA SYNTAX: FAIL"; exit 1; }

      - name: Resolve SPACE includeFile() chains (correct per-subsystem base; only ship/space includes)
        shell: bash
        run: |
          cd MMOCoreORB/bin/scripts
          # Core3 includeFile base is the top-level subsystem dir (screenplays/, loot/, object/, managers/, mobile/).
          # Recursively follow includes, but only REPORT failures on paths containing ship/space (our P4 work);
          # pre-existing Stardust broken includes (e.g. items/smuggler/*) are out of scope.
          python3 - <<'PY'
          import os, re
          roots = ['screenplays/screenplays.lua','loot/items.lua','loot/groups.lua','object/serverobjects.lua']
          def base_of(path):
              top = path.split('/')[0]
              return top  # includeFile paths are relative to the subsystem top dir
          seen=set(); missing=[]; checked=0
          def walk(f):
              global checked
              if f in seen or not os.path.isfile(f): return
              seen.add(f)
              top=f.split('/')[0]
              try: txt=open(f,encoding='utf-8',errors='ignore').read()
              except: return
              for m in re.findall(r'includeFile\("([^"]+)"', txt):
                  target=os.path.join(top, m)
                  isspace = ('ship' in m) or ('space' in m)
                  if os.path.isfile(target):
                      checked+=1
                      if target.endswith('.lua'): walk(target)
                  else:
                      if isspace: missing.append((f,m,target))
          for r in roots: walk(r)
          print(f"resolved {checked} includes (recursive)")
          for f,m,t in missing: print(f"MISSING SPACE INCLUDE: {f} -> {m}  (expected {t})")
          print("INCLUDE RESOLUTION: " + ("PASS" if not missing else "FAIL"))
          import sys; sys.exit(1 if missing else 0)
          PY
