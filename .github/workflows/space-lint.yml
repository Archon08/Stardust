name: space-lint

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to lint'
        required: true
        default: 'stardust-space'

env:
  CORE3_PIN: 6856f315a80b5250635b2272695caec1d64204ed

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Install lua5.3
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.3

      - name: Fetch pinned upstream Core3
        run: |
          wget -qO /tmp/core3.tar.gz "https://github.com/swgemu/Core3/archive/${CORE3_PIN}.tar.gz"
          mkdir -p /tmp/core3 && tar -xzf /tmp/core3.tar.gz -C /tmp/core3 --strip-components=1

      - name: Lua syntax-check all space content + registration files
        shell: bash
        run: |
          cd MMOCoreORB/bin/scripts
          FAIL=0; CHECKED=0
          while IFS= read -r -d '' f; do
            luac5.3 -p "$f" 2>/tmp/e || { echo "SYNTAX FAIL: $f"; cat /tmp/e; FAIL=1; }
            CHECKED=$((CHECKED+1))
          done < <(find ai_space managers/space ship_mobile mobile/space mobile/conversations/space \
                        screenplays/space object/ship object/intangible/ship object/tangible/ship \
                        object/tangible/space object/static/space object/draft_schematic/space \
                        loot/groups/ship loot/groups/space loot/items/ship loot/items/space \
                        -name '*.lua' -print0 2>/dev/null)
          for r in loot/items.lua loot/groups.lua object/serverobjects.lua screenplays/screenplays.lua; do
            [ -f "$r" ] && { luac5.3 -p "$r" 2>/tmp/e || { echo "SYNTAX FAIL (reg): $r"; cat /tmp/e; FAIL=1; }; CHECKED=$((CHECKED+1)); }
          done
          echo "lua-parsed $CHECKED files"
          [ $FAIL -eq 0 ] && echo "LUA SYNTAX: PASS" || { echo "LUA SYNTAX: FAIL"; exit 1; }

      - name: Content fidelity — unchanged space dirs must equal upstream pin (authored paths allowlisted)
        shell: bash
        run: |
          cd MMOCoreORB/bin/scripts
          UP=/tmp/core3/MMOCoreORB/bin/scripts
          ALLOW="$GITHUB_WORKSPACE/tools/fidelity/authored-allowlist.txt"
          FAIL=0
          for d in ai_space managers/space ship_mobile mobile/space mobile/conversations/space \
                   screenplays/space object/ship object/intangible/ship object/tangible/ship \
                   object/tangible/space object/static/space object/draft_schematic/space \
                   loot/groups/ship loot/groups/space loot/items/ship loot/items/space; do
            if [ ! -d "$UP/$d" ]; then echo "NOTE: upstream lacks $d (skip)"; continue; fi
            OUT=$(diff -rq "$UP/$d" "$d" 2>&1 || true)
            # drop intentionally-authored (allowlisted) paths from the must-match-upstream requirement
            if [ -f "$ALLOW" ]; then OUT=$(printf '%s\n' "$OUT" | grep -vE -f "$ALLOW" || true); fi
            OUT=$(printf '%s\n' "$OUT" | grep -v '^[[:space:]]*$' || true)
            if [ -n "$OUT" ]; then echo "FIDELITY DIFF in $d (non-allowlisted):"; echo "$OUT" | head -20; FAIL=1; fi
          done
          [ $FAIL -eq 0 ] && echo "CONTENT FIDELITY: PASS (unchanged==upstream; authored squadron paths allowlisted)" || { echo "CONTENT FIDELITY: FAIL"; exit 1; }

      - name: Registration — our space includes must resolve (failure only if upstream HAS the target = copy gap)
        shell: bash
        run: |
          cd MMOCoreORB/bin/scripts
          UP=/tmp/core3/MMOCoreORB/bin/scripts python3 - <<'PY'
          import os, re
          UP=os.environ['UP']
          roots=['screenplays/screenplays.lua','loot/items.lua','loot/groups.lua','object/serverobjects.lua']
          seen=set(); real=[]; deadup=0; ok=0
          def walk(f):
              global deadup, ok
              if f in seen or not os.path.isfile(f): return
              seen.add(f); top=f.split('/')[0]
              for m in re.findall(r'includeFile\("([^"]+)"', open(f,encoding='utf-8',errors='ignore').read()):
                  tgt=os.path.join(top,m)
                  if not (('ship' in m) or ('space' in m)):
                      if os.path.isfile(tgt) and tgt.endswith('.lua'): walk(tgt)
                      continue
                  if os.path.isfile(tgt):
                      ok+=1
                      if tgt.endswith('.lua'): walk(tgt)
                  else:
                      if os.path.isfile(os.path.join(UP,top,m)): real.append((f,m))
                      else: deadup+=1
          for r in roots: walk(r)
          print(f"space includes resolved OK: {ok}; upstream-faithful dead includes (non-fatal): {deadup}")
          for f,m in real: print(f"REAL COPY GAP: {f} -> {m} (exists upstream, missing here)")
          print("REGISTRATION: " + ("PASS" if not real else "FAIL"))
          import sys; sys.exit(1 if real else 0)
          PY

      - name: Lua require() resolution — required modules must exist locally
        shell: bash
        run: |
          cd MMOCoreORB/bin/scripts
          FAIL=0; CHECKED=0
          while IFS= read -r -d '' f; do
            while IFS= read -r mod; do
              [ -z "$mod" ] && continue
              tgt="$(echo "$mod" | tr '.' '/').lua"
              CHECKED=$((CHECKED+1))
              # lua package.path resolves modules from BOTH bin/scripts/ (cwd) and bin/ (../):
              # "utils.space_helpers" -> scripts/utils/space_helpers.lua, and
              # "scripts.managers.space.regions.regions" -> bin/scripts/managers/.../regions.lua are both valid.
              if [ ! -f "$tgt" ] && [ ! -f "../$tgt" ]; then
                echo "MISSING REQUIRE: $f -> require(\"$mod\") expects $tgt (checked bin/scripts/ and bin/)"
                FAIL=1
              fi
            done < <(grep -ohE 'require\("[^"]+"\)' "$f" 2>/dev/null | sed -E 's/.*require\("([^"]+)"\).*/\1/')
          done < <(find ai_space managers/space ship_mobile mobile/space mobile/conversations/space \
                        screenplays/space utils -name '*.lua' -print0 2>/dev/null)
          echo "require-resolution checked $CHECKED calls"
          [ $FAIL -eq 0 ] && echo "REQUIRE RESOLUTION: PASS" || { echo "REQUIRE RESOLUTION: FAIL (a require() target .lua is missing — would crash at runtime)"; exit 1; }
