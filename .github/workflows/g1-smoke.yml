name: g1-smoke

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to smoke-test'
        required: true
        default: 'space-port/phase-1'

jobs:
  smoke:
    runs-on: ubuntu-latest
    container: debian:bookworm
    timeout-minutes: 350
    steps:
      - name: Install toolchain & deps
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates cmake ninja-build g++ gcc make ccache \
            default-jre-headless \
            liblua5.3-dev lua5.3 \
            libdb5.3-dev db5.3-util \
            libmariadb-dev libmariadb-dev-compat mariadb-server mariadb-client \
            libssl-dev zlib1g-dev libpcre3-dev libreadline-dev \
            libboost-dev libboost-thread-dev libboost-system-dev libjemalloc-dev \
            procps
          apt-get install -y wget gnupg lsb-release software-properties-common
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          /tmp/llvm.sh 17 || /tmp/llvm.sh 17
          ln -sf /usr/bin/clang-17 /usr/local/bin/clang
          ln -sf /usr/bin/clang++-17 /usr/local/bin/clang++
          ln -sf /usr/bin/ld.lld-17 /usr/local/bin/ld.lld

      - name: Checkout (with engine3 submodule)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          submodules: recursive

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.event.inputs.branch }}-smoke-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.event.inputs.branch }}-
            ccache-

      - name: Configure & build
        working-directory: MMOCoreORB
        shell: bash
        run: |
          set -o pipefail
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCOMPILE_TESTS=OFF \
            -DENABLE_NATIVE=OFF \
            -DENABLE_BUILD_CLIENT=OFF \
            2>&1 | tee ../configure.log
          ninja -C build 2>&1 | tail -5 | tee ../build.log

      - name: Set up MariaDB + schema
        shell: bash
        run: |
          mkdir -p /var/run/mysqld && chown mysql:mysql /var/run/mysqld
          mysqld_safe --skip-grant-tables=0 &
          for i in $(seq 1 30); do mysqladmin ping 2>/dev/null && break; sleep 2; done
          mysql -e "CREATE DATABASE IF NOT EXISTS swgemu; CREATE USER IF NOT EXISTS 'swgemu'@'localhost' IDENTIFIED BY '123456'; CREATE USER IF NOT EXISTS 'swgemu'@'127.0.0.1' IDENTIFIED BY '123456'; GRANT ALL ON *.* TO 'swgemu'@'localhost'; GRANT ALL ON *.* TO 'swgemu'@'127.0.0.1'; FLUSH PRIVILEGES;"
          mysql swgemu < MMOCoreORB/sql/swgemu.sql
          [ -f MMOCoreORB/sql/datatables.sql ] && mysql swgemu < MMOCoreORB/sql/datatables.sql || true
          [ -f MMOCoreORB/sql/mantis.sql ] && mysql swgemu < MMOCoreORB/sql/mantis.sql || true

      - name: Boot check (init machinery up to TRE/asset load)
        working-directory: MMOCoreORB/bin
        shell: bash
        run: |
          ls -la core3 || cp ../build/src/core3 . || exit 1
          mkdir -p log databases navmeshes
          timeout 180 ./core3 > ../../boot-stdout.log 2>&1 || true
          echo "=== stdout tail ==="
          tail -40 ../../boot-stdout.log

      - name: Grade boot
        shell: bash
        run: |
          ALL=$(cat boot-stdout.log MMOCoreORB/bin/log/core3.log 2>/dev/null || cat boot-stdout.log)
          PASS=1
          echo "$ALL" | grep -q "DistributedObjectBroker] started" || { echo "FAIL: ORB never started"; PASS=0; }
          echo "$ALL" | grep -q "connected to 127.0.0.1:3306" || { echo "FAIL: no DB connection"; PASS=0; }
          echo "$ALL" | grep -qi "TreeFile" || { echo "FAIL: never reached TRE/asset stage"; PASS=0; }
          if echo "$ALL" | grep -qiE "segmentation|SIGSEGV|dumped core"; then
            if echo "$ALL" | grep -qi "TreeFile.*does not exist"; then
              echo "NOTE: crash after missing-TRE stage - expected in CI without client assets"
            else
              echo "FAIL: crash before asset stage"
              PASS=0
            fi
          fi
          if [ $PASS -eq 1 ]; then
            echo "G1-CI INIT-MACHINERY: PASS (BDB+MySQL+ORB+Lua up; full TRE-backed zone smoke = operator-run)"
          else
            echo "G1-CI: FAIL"
            exit 1
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g1-smoke-logs-${{ github.run_number }}
          path: |
            boot-stdout.log
            configure.log
            MMOCoreORB/bin/log/
          retention-days: 14
