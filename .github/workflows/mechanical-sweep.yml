name: mechanical-sweep

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to sweep and push to'
        required: true
        default: 'space-port/phase-1'
      mode:
        description: 'Sweep mode: null-cpp (NULL->nullptr in cpp/h/idl) or null-idl (==/!= null -> nullptr in idl)'
        required: true
        default: 'null-idl'

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: null-cpp sweep (quote-aware NULL -> nullptr)
        if: ${{ github.event.inputs.mode == 'null-cpp' }}
        run: |
          cat > /tmp/sweep.pl << 'PERL'
          #!/usr/bin/perl
          use strict; use warnings;
          local $/;
          my $src = <>;
          my @out;
          for my $part (split /("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/s, $src) {
            if ($part =~ /^["']/) { push @out, $part; next; }
            $part =~ s/\bNULL\b/nullptr/g;
            push @out, $part;
          }
          print join('', @out);
          PERL
          COUNT=0
          while IFS= read -r -d '' f; do
            if grep -q 'NULL' "$f"; then
              perl /tmp/sweep.pl "$f" > "$f.swept" && mv "$f.swept" "$f" || { rm -f "$f.swept"; echo "sweep failed: $f"; exit 1; }
              COUNT=$((COUNT+1))
            fi
          done < <(find MMOCoreORB/src -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.idl' \) -print0)
          echo "swept $COUNT files"
          git diff --shortstat

      - name: null-idl sweep (==/!= null -> nullptr comparisons only; idlc passes nullptr through, NULL it emits is ambiguous vs modern Reference)
        if: ${{ github.event.inputs.mode == 'null-idl' }}
        run: |
          # self-test
          printf 'if (x != null) { y = a == null; } void f(TreeNode n = null);\n' > /tmp/st.idl
          perl -pe 's/!=\s*null\b/!= nullptr/g; s/==\s*null\b/== nullptr/g' /tmp/st.idl
          RES=$(perl -pe 's/!=\s*null\b/!= nullptr/g; s/==\s*null\b/== nullptr/g' /tmp/st.idl)
          echo "$RES" | grep -q 'x != nullptr' || { echo 'SELF-TEST FAIL: neq'; exit 1; }
          echo "$RES" | grep -q 'a == nullptr' || { echo 'SELF-TEST FAIL: eq'; exit 1; }
          echo "$RES" | grep -q 'n = null)' || { echo 'SELF-TEST FAIL: default arg must stay null'; exit 1; }
          echo "self-test OK"
          COUNT=0
          while IFS= read -r -d '' f; do
            if grep -qE '(==|!=)[[:space:]]*null\b' "$f"; then
              perl -i -pe 's/!=\s*null\b/!= nullptr/g; s/==\s*null\b/== nullptr/g' "$f"
              COUNT=$((COUNT+1))
            fi
          done < <(find MMOCoreORB/src -type f -name '*.idl' -print0)
          echo "swept $COUNT idl files"
          git diff --shortstat

      - name: idl-truthiness sweep (x != nullptr -> x; x == nullptr -> !(x); idlc rejects nullptr identifier)
        if: ${{ github.event.inputs.mode == 'idl-truthiness' }}
        run: |
          T() { echo "$1" | perl -pe 's/s*!=s*nullptr//g; s/([A-Za-z_]w*(?:(?:.[A-Za-z_]w*)?((?:[^()"]|"[^"]*")*)|.[A-Za-z_]w*)*)s*==s*nullptr/!($1)/g'; }
          [ "$(T 'if (x != nullptr) {')" = 'if (x) {' ] || { echo FAIL1; exit 1; }
          [ "$(T 'return node != nullptr;')" = 'return node;' ] || { echo FAIL2; exit 1; }
          [ "$(T 'if (x.method() == nullptr)')" = 'if (!(x.method()))' ] || { echo FAIL3; exit 1; }
          [ "$(T 'if (x.field == nullptr || y())')" = 'if (!(x.field) || y())' ] || { echo FAIL4; exit 1; }
          [ "$(T 'bool b = m.check("s") == nullptr;')" = 'bool b = !(m.check("s"));' ] || { echo FAIL5; exit 1; }
          echo self-test OK
          COUNT=0
          while IFS= read -r -d '' f; do
            if grep -q 'nullptr' "$f"; then
              perl -i -pe 's/s*!=s*nullptr//g; s/([A-Za-z_]w*(?:(?:.[A-Za-z_]w*)?((?:[^()"]|"[^"]*")*)|.[A-Za-z_]w*)*)s*==s*nullptr/!($1)/g' "$f"
              COUNT=$((COUNT+1))
            fi
          done < <(find MMOCoreORB/src -type f -name '*.idl' -print0)
          echo "swept $COUNT idl files"
          git diff --shortstat

      - name: Commit and push
        run: |
          git config user.name "space-port-sweep"
          git config user.email "noreply@anthropic.com"
          git add -A MMOCoreORB/src
          git commit -m "P1.4: mechanical sweep (${{ github.event.inputs.mode }})" || echo "nothing to commit"
          git push origin HEAD:${{ github.event.inputs.branch }}
