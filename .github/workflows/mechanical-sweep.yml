name: mechanical-sweep

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to sweep and push to'
        required: true
        default: 'space-port/phase-1'

permissions:
  contents: write

jobs:
  null-to-nullptr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Quote-aware NULL -> nullptr sweep over MMOCoreORB/src
        run: |
          cat > /tmp/sweep.pl << 'PERL'
          #!/usr/bin/perl
          # Replace token NULL with nullptr outside of string/char literals.
          use strict; use warnings;
          local $/;
          my $src = <>;
          my @out;
          for my $part (split /("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/s, $src) {
            if ($part =~ /^["']/) { push @out, $part; next; }
            $part =~ s/\bNULL\b/nullptr/g;
            push @out, $part;
          }
          print join('', @out);
          PERL
          perl -c /tmp/sweep.pl 2>&1 || true
          # self-test before touching the tree
          printf 'x == NULL; s = "IS NULL"; c = %s;\n' "'a'" > /tmp/st.c
          perl /tmp/sweep.pl /tmp/st.c
          RES=$(perl /tmp/sweep.pl /tmp/st.c)
          echo "$RES" | grep -q 'x == nullptr' || { echo 'SELF-TEST FAIL: replacement'; exit 1; }
          echo "$RES" | grep -q 'IS NULL' || { echo 'SELF-TEST FAIL: string protection'; exit 1; }
          echo "self-test OK"
          COUNT=0
          while IFS= read -r -d '' f; do
            if grep -q 'NULL' "$f"; then
              perl /tmp/sweep.pl "$f" > "$f.swept" && mv "$f.swept" "$f" || { rm -f "$f.swept"; echo "sweep failed: $f"; exit 1; }
              COUNT=$((COUNT+1))
            fi
          done < <(find MMOCoreORB/src -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.idl' \) -print0)
          echo "swept $COUNT files"
          git diff --shortstat

      - name: Commit and push
        run: |
          git config user.name "space-port-sweep"
          git config user.email "noreply@anthropic.com"
          git add -A MMOCoreORB/src
          git commit -m "P1.4: mechanical NULL -> nullptr sweep over MMOCoreORB/src (quote-aware; modern engine3 Reference<T> requires nullptr comparisons)" || echo "nothing to commit"
          git push origin HEAD:${{ github.event.inputs.branch }}
