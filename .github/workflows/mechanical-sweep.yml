name: mechanical-sweep

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to sweep and push to'
        required: true
        default: 'space-port/phase-1'
      mode:
        description: 'Sweep mode: null-cpp | null-idl | idl-truthiness'
        required: true
        default: 'null-cpp'

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: null-cpp sweep (string- AND comment-aware NULL -> nullptr)
        if: ${{ github.event.inputs.mode == 'null-cpp' }}
        run: |
          cat > /tmp/sweep.pl << 'PERL'
          #!/usr/bin/perl
          # Replace token NULL with nullptr outside of string literals, char literals, and comments.
          use strict; use warnings;
          local $/;
          my $src = <>;
          my @out;
          for my $part (split m{("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|//[^\n]*|/\*.*?\*/)}s, $src) {
            if ($part =~ m{^["'/]}) { push @out, $part; next; }
            $part =~ s/\bNULL\b/nullptr/g;
            push @out, $part;
          }
          print join('', @out);
          PERL
          # self-tests: comment with apostrophe must not swallow following code
          printf '// do not let this break: x\nif (a == NULL) b();\n/* block " quote */ c = NULL;\ns = "keep NULL"; t = '"'"'x'"'"'; u = NULL;\n' > /tmp/st.c
          perl /tmp/sweep.pl /tmp/st.c
          RES=$(perl /tmp/sweep.pl /tmp/st.c)
          echo "$RES" | grep -q 'a == nullptr' || { echo 'FAIL: basic'; exit 1; }
          echo "$RES" | grep -q 'c = nullptr' || { echo 'FAIL: after block comment'; exit 1; }
          echo "$RES" | grep -q 'keep NULL' || { echo 'FAIL: string protection'; exit 1; }
          echo "$RES" | grep -q 'u = nullptr' || { echo 'FAIL: after char literal'; exit 1; }
          printf "// don%st stop\nv = NULL;\n" "'" > /tmp/st2.c
          RES2=$(perl /tmp/sweep.pl /tmp/st2.c)
          echo "$RES2" | grep -q 'v = nullptr' || { echo 'FAIL: apostrophe-in-comment must not protect code'; exit 1; }
          echo "self-test OK"
          COUNT=0
          while IFS= read -r -d '' f; do
            if grep -q 'NULL' "$f"; then
              perl /tmp/sweep.pl "$f" > "$f.swept" && mv "$f.swept" "$f" || { rm -f "$f.swept"; echo "sweep failed: $f"; exit 1; }
              COUNT=$((COUNT+1))
            fi
          done < <(find MMOCoreORB/src -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.idl' \) -print0)
          echo "swept $COUNT files"
          git diff --shortstat

      - name: null-idl sweep (==/!= null -> nullptr comparisons; superseded by idl-truthiness)
        if: ${{ github.event.inputs.mode == 'null-idl' }}
        run: |
          COUNT=0
          while IFS= read -r -d '' f; do
            if grep -qE '(==|!=)[[:space:]]*null\b' "$f"; then
              perl -i -pe 's/!=\s*null\b/!= nullptr/g; s/==\s*null\b/== nullptr/g' "$f"
              COUNT=$((COUNT+1))
            fi
          done < <(find MMOCoreORB/src -type f -name '*.idl' -print0)
          echo "swept $COUNT idl files"
          git diff --shortstat

      - name: idl-truthiness sweep (x != nullptr -> x, x == nullptr -> !(x); idlc rejects the nullptr identifier)
        if: ${{ github.event.inputs.mode == 'idl-truthiness' }}
        run: |
          cat > /tmp/truthy.pl << 'PERL'
          #!/usr/bin/perl
          use strict; use warnings;
          while (<>) {
            s/\s*!=\s*nullptr\b//g;
            s/([A-Za-z_]\w*(?:(?:\.[A-Za-z_]\w*)?\((?:[^()"]|"[^"]*")*\)|\.[A-Za-z_]\w*)*)\s*==\s*nullptr\b/!($1)/g;
            print;
          }
          PERL
          COUNT=0
          while IFS= read -r -d '' f; do
            if grep -q 'nullptr' "$f"; then
              perl -i /tmp/truthy.pl "$f"
              COUNT=$((COUNT+1))
            fi
          done < <(find MMOCoreORB/src -type f -name '*.idl' -print0)
          echo "swept $COUNT idl files"
          git diff --shortstat

      - name: Commit and push
        run: |
          git config user.name "space-port-sweep"
          git config user.email "noreply@anthropic.com"
          git add -A MMOCoreORB/src
          git commit -m "P1.4: mechanical sweep (${{ github.event.inputs.mode }})" || echo "nothing to commit"
          git push origin HEAD:${{ github.event.inputs.branch }}
