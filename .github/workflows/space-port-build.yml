name: space-port-build

on:
  push:
    branches: ['space-port/**']
    paths-ignore: ['docs/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:bookworm
    timeout-minutes: 350
    steps:
      - name: Install toolchain & deps
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates cmake ninja-build g++ gcc make ccache \
            default-jre-headless \
            liblua5.3-dev lua5.3 \
            libdb5.3-dev db5.3-util \
            libmariadb-dev libmariadb-dev-compat \
            libssl-dev zlib1g-dev libpcre3-dev libreadline-dev \
            libboost-dev libboost-thread-dev libboost-system-dev libjemalloc-dev
          apt-get install -y wget gnupg lsb-release software-properties-common
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          /tmp/llvm.sh 17 || /tmp/llvm.sh 17
          ln -sf /usr/bin/clang-17 /usr/local/bin/clang
          ln -sf /usr/bin/clang++-17 /usr/local/bin/clang++
          ln -sf /usr/bin/ld.lld-17 /usr/local/bin/ld.lld
          clang++ --version

      - name: Checkout (with engine3 submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.ref_name }}-
            ccache-

      - name: Configure
        working-directory: MMOCoreORB
        shell: bash
        run: |
          set -o pipefail
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCOMPILE_TESTS=OFF \
            -DENABLE_NATIVE=OFF \
            -DENABLE_BUILD_CLIENT=OFF \
            2>&1 | tee ../configure.log

      - name: Build
        working-directory: MMOCoreORB
        shell: bash
        run: |
          set -o pipefail
          ninja -C build -k 50 2>&1 | tee ../build.log

      - name: Error digest (always)
        if: always()
        run: |
          echo '== FIRST 80 ERRORS =='
          grep -nE 'error:|Error|FAILED:' build.log configure.log 2>/dev/null | head -80 || echo 'no errors found'

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            configure.log
            build.log
          retention-days: 14

      - name: Upload core3 binary + runtime deps manifest
        if: always()
        shell: bash
        run: |
          mkdir -p out
          cp MMOCoreORB/build/src/core3 out/ 2>/dev/null && echo "got core3 ($(du -h out/core3 | cut -f1))" || echo "no core3 binary"
          # any engine3 shared lib (if linked shared)
          find MMOCoreORB -name 'libengine3*.so*' -exec cp {} out/ \; 2>/dev/null
          ls -la out/
          echo "=== ldd (exact runtime shared-lib deps for the runner container) ==="
          ldd out/core3 2>&1 | tee out/core3.ldd.txt || true

      - name: Upload core3 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core3-binary-${{ github.run_number }}
          path: |
            out/core3
            out/libengine3*
            out/core3.ldd.txt
          retention-days: 14
